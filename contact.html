
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact Us - TravelBloom</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
    body { background-color: #f4f7f9; color: #222; }
    nav {
      display: flex; justify-content: space-between; align-items: center;
      background-color: #0b2545; padding: 14px 30px; color: white;
    }
    .logo { font-size: 22px; font-weight: bold; color: #00d4ff; }
    .nav-links { display: flex; gap: 20px; }
    .nav-links a { color: white; text-decoration: none; font-weight: bold; }
    .container { max-width: 600px; margin: 50px auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 3px 10px rgba(0,0,0,0.08); }
    h1 { color: #0b2545; margin-bottom: 10px; }
    p { margin-bottom: 20px; color: #555; }
    label { display: block; margin-bottom: 6px; font-weight: bold; }
    input, textarea {
      width: 100%; padding: 10px; margin-bottom: 16px; border: 1px solid #ccc; border-radius: 4px;
    }
    button {
      width: 100%; padding: 12px; background: #00a896; color: white; border: none; border-radius: 4px; font-size: 16px; font-weight: bold; cursor: pointer;
    }
  </style>
</head>
<body>
  <nav>
    <div class="logo">TravelBloom</div>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="about.html">About Us</a>
      <a href="contact.html">Contact Us</a>
    </div>
  </nav>

  <div class="container">
    <h1>CONTACT US</h1>
    <p>Get in touch with us for travel inquiries or support.</p>
    <form onsubmit="event.preventDefault(); alert('Thank you for contacting TravelBloom!'); this.reset();">
      <label for="name">Name</label>
      <input type="text" id="name" placeholder="Enter your name" required />

      <label for="email">Email</label>
      <input type="email" id="email" placeholder="Enter your email" required />

      <label for="message">Message</label>
      <textarea id="message" rows="5" placeholder="Write your message here..." required></textarea>

      <button type="submit">Submit</button>
    </form>
  </div>
</body>
</html>
